
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | Student Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">Student Management</a>
        <nav>
            <a class="active" href="/">Add Student</a>
            <a href="/students">All Students</a>
        </nav>
    </header>

    <main class="container">
        <section class="page-heading">
            <p class="eyebrow">STUDENT RECORDS</p>
            <h1>Add a New Student</h1>
            <p>Enter the student's details below.</p>
        </section>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <section class="panel form-panel">
            <form method="POST" action="/add">
                <div class="form-group">
                    <label for="student_id">Student ID</label>
                    <input id="student_id" type="text" name="student_id"
                           placeholder="e.g. STU003" required>
                </div>

                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input id="full_name" type="text" name="full_name"
                           placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" name="email"
                           placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" name="department" required>
                        <option value="" disabled selected>Select department</option>
                        <option value="CSE">CSE</option>
                        <option value="EEE">EEE</option>
                        <option value="BBA">BBA</option>
                    </select>
                </div>

                <button class="btn primary full-width" type="submit">
                    Save Student
                </button>
            </form>
        </section>
    </main>
</body>
</html>
